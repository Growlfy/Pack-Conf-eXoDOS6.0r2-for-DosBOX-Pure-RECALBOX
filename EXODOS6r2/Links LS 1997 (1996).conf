serial2=dummy
serial3=disabled
serial4=disabled
[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto
[ipx]
ipx=true
[autoexec]
remount C Y
SUBST C: Y:\LinksLS1
imgmount -u d
imgmount d "c:\cd\links LS 1997 (1 of 3).cue" "c:\cd\links LS 1997 (2 of 3).cue" "c:\cd\links LS 1997 (3 of 3).cue" -t cdrom
imgmount -u e
imgmount e "c:\courses\congress.img" "c:\courses\miyazaki.cue" -t cdrom
imgmount -u f
imgmount f "c:\courses\oakland.img" -t cdrom
imgmount -u g
imgmount g "c:\courses\valderrama.img" -t cdrom
imgmount -u h
imgmount h "c:\courses\valhalla.img" -t cdrom
imgmount -u i
imgmount i "c:\cd\linksls.cue" -t cdrom
imgmount -u j
imgmount j "c:\courses\DavisLoveIIISeaIsland.cue" -t cdrom
c:
@echo off
echo.
echo This game spans 3 CDs
echo When prompted use :
echo - HK + LeftStick Up to eject the disc.
echo - HK + LeftStick Right/Left to change discs,
echo - HK + LeftStick Up to load the disc.
echo.
pause
call run
