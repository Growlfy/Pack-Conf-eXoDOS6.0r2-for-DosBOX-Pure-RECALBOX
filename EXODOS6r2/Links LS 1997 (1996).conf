[sdl]
fullscreen=true
fulldouble=false
fullresolution=desktop
windowresolution=1280x960
output=texture
autolock=true
sensitivity=100
waitonerror=true
priority=higher,higher
mapperfile=mapper.map
usescancodes=true
renderer=auto
vsync=false
[dosbox]
machine=svga_s3
captures=capture
memsize=32
[render]
frameskip=0
aspect=true
scaler=normal2x
[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20
[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20
[midi]
